[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhombar-photo3d"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.6.0", "torchvision==0.21.0", "numpy==1.26.4",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pillow>=11,<13",
  "omegaconf==2.3.0", "einops==0.7.0", "transformers==4.35.0",
  "huggingface-hub==0.17.3", "trimesh>=4,<5", "rembg[cpu]==2.0.61",
  "imageio[ffmpeg]>=2.31,<3", "opencv-python-headless==4.10.0.84",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nhombar_photo3d*"]
