[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhombar-vision"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "ultralytics==8.4.190",
  "torch>=2.6,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pillow>=11,<13",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nhombar_vision*"]
