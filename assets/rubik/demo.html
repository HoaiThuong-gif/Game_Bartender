<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rubik 3D demo (Blender → GLB → Three.js)</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; width: 100%; height: 100%; }
    #bar {
      position: fixed; left: 0; right: 0; bottom: 16px; z-index: 10;
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
      font: 14px system-ui, sans-serif;
    }
    #bar button {
      padding: 10px 16px; border: 0; border-radius: 999px;
      background: #2b2f36; color: #fff; cursor: pointer;
    }
    #bar button:active { background: #3d434d; }
  </style>
</head>
<body>
<div id="bar">
  <button id="solved">Đã giải</button>
  <button id="scrambled">Xáo trộn (mẫu)</button>
  <button id="wire">Lưới polygon: tắt</button>
</div>
<script src="./rubik.js"></script>
<script>
  // Facelet order: U R F D L B (9 each). Any string of 54 chars from URFDLB?
  const SOLVED    = 'UUUUUUUUU' + 'RRRRRRRRR' + 'FFFFFFFFF' + 'DDDDDDDDD' + 'LLLLLLLLL' + 'BBBBBBBBB';
  const SCRAMBLED = 'DRLUUFBRB' + 'LUDRRBFUF' + 'BFRFFLDLU' + 'RDUDDFLRB' + 'FLLBLUDBD' + 'ULBRBUFDR';
  let wire = false;
  document.getElementById('solved').onclick = () => window.setCubeState(SOLVED);
  document.getElementById('scrambled').onclick = () => window.setCubeState(SCRAMBLED);
  document.getElementById('wire').onclick = (e) => {
    wire = !wire;
    window.setRubikWireframe(wire);
    e.target.textContent = 'Lưới polygon: ' + (wire ? 'bật' : 'tắt');
  };
</script>
</body>
</html>
